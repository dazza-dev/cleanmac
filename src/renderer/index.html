<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>CleanMac</title>
    <!--
      Strict CSP. No inline scripts, no eval, no remote origins: this app has
      Full Disk Access, so any capacity to load outside code is unacceptable.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
